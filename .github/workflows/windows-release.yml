name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - run: pnpm tauri:build

      - name: Read app version
        shell: pwsh
        run: |
          $package = Get-Content "package.json" | ConvertFrom-Json
          "MEDO_VERSION=$($package.version)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was found."
          }
          Get-FileHash $installer.FullName -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($installer.Name)" | Out-File -Encoding utf8 "SHA256SUMS.txt"
          }
          Get-Content "SHA256SUMS.txt"

      - name: Upload Windows NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: medo-windows-nsis-${{ env.MEDO_VERSION }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
          if-no-files-found: error
