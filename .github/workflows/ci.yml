name: CI

on:
  push:
  pull_request:

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  windows-release-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Generate temporary Tauri icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null

          $width = 32
          $height = 32
          $pixelBytes = $width * $height * 4
          $maskRowBytes = [int]([Math]::Ceiling($width / 32.0) * 4)
          $maskBytes = $maskRowBytes * $height
          $imageBytes = 40 + $pixelBytes + $maskBytes
          $imageOffset = 6 + 16

          $fs = [IO.File]::Create('src-tauri/icons/icon.ico')
          $bw = New-Object IO.BinaryWriter($fs)
          try {
            # ICONDIR
            $bw.Write([UInt16]0)
            $bw.Write([UInt16]1)
            $bw.Write([UInt16]1)

            # ICONDIRENTRY
            $bw.Write([Byte]$width)
            $bw.Write([Byte]$height)
            $bw.Write([Byte]0)
            $bw.Write([Byte]0)
            $bw.Write([UInt16]1)
            $bw.Write([UInt16]32)
            $bw.Write([UInt32]$imageBytes)
            $bw.Write([UInt32]$imageOffset)

            # BITMAPINFOHEADER, without BMP file header, with doubled height for ICO mask.
            $bw.Write([UInt32]40)
            $bw.Write([Int32]$width)
            $bw.Write([Int32]($height * 2))
            $bw.Write([UInt16]1)
            $bw.Write([UInt16]32)
            $bw.Write([UInt32]0)
            $bw.Write([UInt32]($pixelBytes + $maskBytes))
            $bw.Write([Int32]0)
            $bw.Write([Int32]0)
            $bw.Write([UInt32]0)
            $bw.Write([UInt32]0)

            # Opaque placeholder pixels, BGRA order.
            for ($i = 0; $i -lt ($width * $height); $i++) {
              $bw.Write([Byte]0x3c)
              $bw.Write([Byte]0x9b)
              $bw.Write([Byte]0xc8)
              $bw.Write([Byte]0xff)
            }

            # AND mask: all zeros means fully opaque.
            $bw.Write((New-Object byte[] $maskBytes))
          } finally {
            $bw.Dispose()
            $fs.Dispose()
          }
      - run: pnpm tauri:build
      - name: Upload Windows NSIS artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: medo-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
