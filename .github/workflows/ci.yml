name: CI

on:
  push:
  pull_request:

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  windows-release-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Generate temporary Tauri icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          $iconBase64 = 'AAABAAEAICAAAAAAIABtAAAAFgAAAIlQTkcNChoKAAAADUlIRIAAAAgAAAAIAgGAAAAc3p69AAAADRJREFUeJztzjEBADAIxMCnDrrVAf4VFhksFwO5uq9/FjubcwAAAAAAAAAAAAAAAAAAgCQZKqcBj3kh12YAAAAASUVORK5CYII='
          $pngBase64 = 'iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAANElEQVR4nO3OMQEAMAjEwKcOutUB/hUWGSwXA7m6r38WO5tzAAAAAAAAAAAAAAAAAACAJBkqpwGPeSHXZgAAAABJRU5ErkJggg=='
          [IO.File]::WriteAllBytes('src-tauri/icons/icon.ico', [Convert]::FromBase64String($iconBase64))
          [IO.File]::WriteAllBytes('src-tauri/icons/icon.png', [Convert]::FromBase64String($pngBase64))
      - run: pnpm tauri:build
      - name: Upload Windows NSIS artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: medo-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
